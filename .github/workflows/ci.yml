name: StayFrame CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build & Test Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Build Scripts
        run: chmod +x build_apk.sh

      - name: Resolve and Cache Dependencies
        run: make install-deps

      - name: Run Unit & Robolectric Tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
